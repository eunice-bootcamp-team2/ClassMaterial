<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Mini Todo (jQuery)</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body{font-family:system-ui;padding:24px;max-width:620px;margin:auto}
    h2{text-align:center}
    .row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
    input{flex:1;min-width:220px;padding:10px}
    button{padding:10px 12px;cursor:pointer}
    .card{margin-top:14px;border:1px solid #eee;border-radius:14px;padding:14px}
    ul{margin:0;padding-left:18px}
    li{display:flex;align-items:center;gap:10px;padding:8px 0}
    .text.done{text-decoration:line-through;color:#888}
    .meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .muted{color:#666;font-size:14px}
    .danger{border:1px solid #f1c7c7;background:#fff5f5;border-radius:10px;padding:8px 10px}
  </style>
</head>
<body>
  <h2>✅ Mini Todo (jQuery)</h2>

  <div class="row">
    <input id="todoInput" placeholder="할 일을 입력하세요 (예: 스쿼트 50회)" />
    <button id="addBtn">추가</button>
    <button id="clearDoneBtn">완료 삭제</button>
  </div>

  <div class="card">
    <div class="meta">
      <div class="muted">남은 할 일: <b id="leftCount">0</b>개</div>
      <div id="msg" class="muted"></div>
    </div>
    <ul id="list"></ul>
  </div>

  <script>
    let todos = []; // {id, text, done}

    function setMsg(t, isError=false){
      $("#msg").text(t || "")
        .toggleClass("danger", !!isError)
        .toggleClass("muted", true);
    }

    function render(){
      $("#list").empty();

      todos.forEach(t => {
        const $li = $("<li/>");

        const $chk = $("<input/>", { type:"checkbox" })
          .prop("checked", t.done)
          .on("change", function(){
            t.done = $(this).prop("checked");
            render();
          });

        const $span = $("<span/>", { class:"text", text:t.text })
          .toggleClass("done", t.done);

        const $del = $("<button/>", { text:"삭제" })
          .on("click", function(){
            todos = todos.filter(x => x.id !== t.id);
            render();
          });

        $li.append($chk, $span, $del);
        $("#list").append($li);
      });

      const left = todos.filter(t => !t.done).length;
      $("#leftCount").text(String(left));
    }

    function addTodo(){
      const text = $("#todoInput").val().trim();
      if (!text){
        setMsg("⚠️ 내용을 입력하세요.", true);
        return;
      }
      setMsg("");
      todos.unshift({ id: crypto.randomUUID(), text, done:false });
      $("#todoInput").val("").focus();
      render();
    }

    function clearDone(){
      const before = todos.length;
      todos = todos.filter(t => !t.done);
      const removed = before - todos.length;
      setMsg(removed ? `🗑️ 완료 ${removed}개 삭제됨` : "삭제할 완료 항목이 없습니다.");
      render();
    }

    $("#addBtn").on("click", addTodo);
    $("#clearDoneBtn").on("click", clearDone);
    $("#todoInput").on("keydown", function(e){
      if (e.key === "Enter") addTodo();
    });

    render();
  </script>
</body>
</html>
